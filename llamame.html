<!doctype html>
<html lang="es">
<head>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<meta charset="utf-8" />
<link rel="icon" type="image/png" href="logo-muffler.png" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title data-i18n="llamame_titulo">Pide que te llamemos</title>
<style>
  body{position:relative;font-family:"Inter",Arial,Helvetica,sans-serif;color:#1f2430;padding:1.5rem;max-width:26rem;margin:0 auto;background:#f6f7f9;}
  .watermark{position:absolute;top:45%;left:50%;transform:translate(-50%,-50%) rotate(-30deg);font-size:2.4rem;font-weight:800;color:rgba(0,0,0,0.055);white-space:nowrap;z-index:0;pointer-events:none;}
  .card{position:relative;overflow:hidden;background:#fff;border-radius:12px;padding:1.75rem;box-shadow:0 1px 4px rgba(0,0,0,.08);margin-top:2rem;}
  .idioma-toggle{position:absolute;top:.9rem;right:.9rem;width:auto;margin:0;padding:.3rem .7rem;font-size:.75rem;font-weight:600;border-radius:999px;background:#f0f1f3;color:#68707e;border:1px solid #d7dade;cursor:pointer;}
  .header{border-bottom:3px solid #d5601a;padding-bottom:1rem;margin-bottom:1.5rem;display:flex;align-items:center;gap:.8rem;}
  .header img{height:3rem;width:3rem;object-fit:cover;object-position:68% 55%;border-radius:8px;flex:none;}
  .header h1{font-size:1.2rem;margin:0;color:#d5601a;}
  p.sub{color:#68707e;font-size:.9rem;margin-top:0;}
  label{display:block;font-size:.85rem;color:#68707e;margin-bottom:.3rem;margin-top:1rem;}
  input{width:100%;padding:.7rem .8rem;border:1px solid #d7dade;border-radius:8px;font-size:1rem;box-sizing:border-box;}
  .field-row{display:flex;gap:.6rem;}
  .field-row > div{flex:1;}
  button{width:100%;margin-top:1.5rem;padding:.9rem 1rem;border-radius:8px;border:none;background:#d5601a;color:#fff;font-size:1rem;font-weight:600;cursor:pointer;}
  button:disabled{opacity:.6;cursor:default;}
  .respuesta-msg{text-align:center;margin-top:1rem;font-weight:600;padding:.9rem;border-radius:8px;background:#e6f4ee;color:#1a7f5a;}
  .respuesta-msg p{font-weight:400;font-size:.85rem;margin:.5rem 0 0;color:#1a7f5a;}
  .error-msg{color:#d6293b;font-size:.85rem;margin-top:.5rem;}
  .btn-secundario{background:#f0f1f3;color:#565e69;}
  .resumen-confirmar{background:#f6f7f9;border:1px solid #e2e4e8;border-radius:8px;padding:.9rem 1rem;margin-top:.75rem;font-size:.9rem;}
  .resumen-confirmar p{margin:.35rem 0;}
</style>
</head>
<body>
  <div class="card" id="contenido">
    <button type="button" class="idioma-toggle" id="idioma-toggle" data-i18n-toggle-label>English</button>
    <div class="watermark" id="watermark-texto"></div>
    <div class="header">
      <img id="logo-img" src="logo-muffler.png" alt="" />
      <h1 id="nombre-negocio">Gil Muffler</h1>
    </div>
    <p class="sub" data-i18n="llamame_sub">Déjanos tus datos y te llamamos en cuanto revisemos tu caso.</p>
    <form id="form-llamame">
      <label for="nombre" data-i18n="llamame_nombre_label">Tu nombre</label>
      <input type="text" id="nombre" required autocomplete="name" />
      <label for="telefono" data-i18n="llamame_telefono_label">Tu teléfono</label>
      <input type="tel" id="telefono" required autocomplete="tel" />
      <label data-i18n="llamame_carro_label">Tu carro</label>
      <div class="field-row">
        <div><input type="text" id="marca" placeholder="Marca" data-i18n-placeholder="campo_marca" /></div>
        <div><input type="text" id="modelo" placeholder="Modelo" data-i18n-placeholder="campo_modelo" /></div>
        <div><input type="text" id="anio" placeholder="Año" data-i18n-placeholder="campo_anio" /></div>
      </div>
      <button type="submit" id="btn-enviar" data-i18n="enviar">Enviar</button>
    </form>

    <div id="confirmar-llamame-box" hidden>
      <p class="sub" id="confirmar-llamame-titulo" tabindex="-1" data-i18n="llamame_confirmar_titulo">Revisa que todo esté correcto antes de enviar.</p>
      <div class="resumen-confirmar" id="resumen-llamame"></div>
      <p class="error-msg" id="error-msg" hidden role="alert"></p>
      <button type="button" id="btn-confirmar-envio-llamame" data-i18n="btn_si_enviar">Sí, enviar</button>
      <button type="button" class="btn-secundario" id="btn-revisar-llamame" data-i18n="btn_revisar_de_nuevo">Revisar de nuevo</button>
    </div>
  </div>

  <script src="i18n.js"></script>
  <script src="config.local.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script>
    let sb;

    function escapeHtml(s) {
      return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    document.getElementById("telefono").addEventListener("input", (e) => {
      const digitos = e.target.value.replace(/\D/g, "").slice(0, 10);
      e.target.value =
        digitos.length <= 3 ? digitos : digitos.length <= 6 ? "(" + digitos.slice(0, 3) + ") " + digitos.slice(3) : "(" + digitos.slice(0, 3) + ") " + digitos.slice(3, 6) + "-" + digitos.slice(6);
    });

    async function cargarConfigNegocio() {
      sb = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
      const { data: cfg } = await sb.from("configuracion_negocio").select("*").eq("id", 1).maybeSingle();
      const nombreNegocio = (cfg && cfg.nombre_negocio) || "Gil Muffler";
      document.getElementById("nombre-negocio").textContent = nombreNegocio;
      document.getElementById("watermark-texto").textContent = nombreNegocio;
      if (cfg && cfg.logo_url) document.getElementById("logo-img").src = cfg.logo_url;
    }

    document.getElementById("form-llamame").addEventListener("submit", (e) => {
      e.preventDefault();
      const nombre = document.getElementById("nombre").value.trim();
      const telefono = document.getElementById("telefono").value.trim();
      const marca = document.getElementById("marca").value.trim();
      const modelo = document.getElementById("modelo").value.trim();
      const anio = document.getElementById("anio").value.trim();
      if (!nombre || !telefono) return;

      const carroTexto = [marca, modelo, anio].filter(Boolean).join(" ");
      document.getElementById("resumen-llamame").innerHTML =
        "<p><strong>" + t("llamame_nombre_label") + ":</strong> " + escapeHtml(nombre) + "</p>" +
        "<p><strong>" + t("llamame_telefono_label") + ":</strong> " + escapeHtml(telefono) + "</p>" +
        (carroTexto ? "<p><strong>" + t("llamame_carro_label") + ":</strong> " + escapeHtml(carroTexto) + "</p>" : "");

      document.getElementById("form-llamame").hidden = true;
      document.getElementById("confirmar-llamame-box").hidden = false;
      document.getElementById("confirmar-llamame-titulo").focus();
    });

    document.getElementById("btn-revisar-llamame").addEventListener("click", () => {
      document.getElementById("confirmar-llamame-box").hidden = true;
      document.getElementById("form-llamame").hidden = false;
      document.getElementById("nombre").focus();
    });

    document.getElementById("btn-confirmar-envio-llamame").addEventListener("click", async () => {
      const nombre = document.getElementById("nombre").value.trim();
      const telefono = document.getElementById("telefono").value.trim();
      const marca = document.getElementById("marca").value.trim();
      const modelo = document.getElementById("modelo").value.trim();
      const anio = document.getElementById("anio").value.trim();
      const errorMsg = document.getElementById("error-msg");
      errorMsg.hidden = true;

      const btn = document.getElementById("btn-confirmar-envio-llamame");
      btn.disabled = true;
      btn.textContent = t("enviando");

      const { error } = await sb.from("llamadas_ordenes").insert({
        nombre_contacto: nombre,
        telefono_contacto: telefono,
        vehiculo_marca: marca || null,
        vehiculo_modelo: modelo || null,
        vehiculo_anio: anio || null,
        motivo: "Cliente pidió que le llamemos (QR del mostrador)",
        hecha: false,
      });

      btn.disabled = false;
      btn.textContent = t("btn_si_enviar");

      if (error) {
        errorMsg.textContent = t("llamame_error");
        errorMsg.hidden = false;
        return;
      }

      const nombreNegocio = escapeHtml(document.getElementById("nombre-negocio").textContent);
      const logoSrc = escapeHtml(document.getElementById("logo-img").src);
      document.getElementById("contenido").innerHTML =
        '<div class="watermark">' + nombreNegocio + "</div>" +
        '<div class="header"><img src="' + logoSrc + '" alt="" /><h1>' + nombreNegocio + "</h1></div>" +
        '<div class="respuesta-msg">' + t("llamame_exito_titulo") +
        "<p>" + t("llamame_exito_texto") + "</p>" +
        "</div>";
    });

    document.getElementById("idioma-toggle").addEventListener("click", () => {
      setIdioma(getIdioma() === "es" ? "en" : "es");
    });
    aplicarIdioma();
    cargarConfigNegocio();
  </script>
</body>
</html>
