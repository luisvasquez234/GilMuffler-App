name: Alerta de stock bajo

on:
  schedule:
    # 7am hora de Lawrence, MA (Eastern), entre semana. No ajusta solo por
    # horario de verano/invierno — revisar si se nota desfasado.
    - cron: '0 11 * * 1-5'
  workflow_dispatch: {}

jobs:
  alerta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Revisar stock y enviar alerta si hace falta
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          GILMUFFLER_CRON_EMAIL: ${{ secrets.GILMUFFLER_CRON_EMAIL }}
          GILMUFFLER_CRON_PASSWORD: ${{ secrets.GILMUFFLER_CRON_PASSWORD }}
        run: node scripts/alerta-stock.mjs
