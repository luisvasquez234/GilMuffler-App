name: Briefing diario de prospectos

on:
  schedule:
    # 7am hora de Lawrence, MA (Eastern). Ojo: no ajusta solo por horario de
    # verano/invierno — revisar y correr este número si se nota desfasado.
    - cron: '0 11 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  briefing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Generar briefing de prospectos
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          FECHA=$(date +%F)
          set +e
          RESPUESTA=$(claude -p "Eres un investigador que ayuda a Luis a encontrar clientes potenciales para su negocio de diseño web. Luis vive en Lawrence, MA y su prueba social principal es la app de gestión que construyó para Gil's Muffler Inc, un taller de mufflers real en esa ciudad. Busca 3 negocios locales (cualquier giro: talleres, restaurantes, tiendas, servicios) en Lawrence, MA o pueblos cercanos (Methuen, Andover, Haverhill, North Andover) que no tengan página web propia o la tengan muy básica (solo ficha de Google/Facebook/Instagram, sin horarios, precios o forma de contactar claramente). Verifica cada uno de verdad antes de listarlo. Entrega la lista en este formato: - **[Nombre]** — [qué le falta] — contacto: [dato o 'no encontrado']. No inventes datos." --allowedTools "WebSearch,WebFetch" --permission-mode acceptEdits 2>&1)
          ESTADO=$?
          set -e
          echo "$RESPUESTA"
          if [ $ESTADO -ne 0 ]; then
            echo "##[error] claude terminó con código $ESTADO"
            exit $ESTADO
          fi

          {
            echo "## Briefing $FECHA"
            echo "$RESPUESTA"
            echo ""
          } >> briefing.md

      - name: Reporte de clientes inactivos (Supabase MCP)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          cat > /tmp/mcp-supabase.json <<EOF
          {
            "mcpServers": {
              "supabase": {
                "command": "npx",
                "args": ["-y", "@supabase/mcp-server-supabase@latest", "--project-ref=tussmuklnvqwkbdcjwtq"],
                "env": { "SUPABASE_ACCESS_TOKEN": "$SUPABASE_ACCESS_TOKEN" }
              }
            }
          }
          EOF
          set +e
          RESPUESTA=$(claude -p "Usa la herramienta execute_sql para correr esta consulta contra la base de datos de Gil Muffler: select c.nombre, c.telefono, max(f.fecha) as ultima_factura from clientes c left join facturas f on f.cliente_id = c.id group by c.id, c.nombre, c.telefono having max(f.fecha) < current_date - interval '90 days' or max(f.fecha) is null order by ultima_factura asc nulls first limit 10; Con el resultado, arma una lista corta en español de los clientes que no han vuelto en más de 90 días (o nunca han facturado), con nombre y teléfono, para que Luis los contacte. Si no hay ninguno, dilo claramente." --mcp-config /tmp/mcp-supabase.json --allowedTools "mcp__supabase__execute_sql" --permission-mode acceptEdits 2>&1)
          ESTADO=$?
          set -e
          echo "$RESPUESTA"
          rm -f /tmp/mcp-supabase.json
          if [ $ESTADO -ne 0 ]; then
            echo "##[error] claude (supabase) terminó con código $ESTADO"
            exit $ESTADO
          fi

          FECHA=$(date +%F)
          {
            echo "### Clientes inactivos (Gil Muffler) — $FECHA"
            echo "$RESPUESTA"
            echo ""
          } >> briefing.md

      - name: Commit y push del briefing
        run: |
          git config user.name "briefing-bot"
          git config user.email "actions@github.com"
          git add briefing.md
          git diff --staged --quiet || git commit -m "Briefing diario $(date +%F)"
          git push
