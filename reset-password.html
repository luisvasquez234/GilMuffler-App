<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<link rel="icon" type="image/png" href="logo-muffler.png" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title data-i18n="reset_password_titulo">Nueva contraseña</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  body{font-family:"Inter",Arial,Helvetica,sans-serif;color:#1f2430;padding:1.5rem;max-width:26rem;margin:3rem auto 0;background:#f6f7f9;}
  .card{background:#fff;border-radius:12px;padding:2rem;box-shadow:0 1px 4px rgba(0,0,0,.08);position:relative;overflow:hidden;}
  .card::before{content:"";position:absolute;top:0;left:0;right:0;height:5px;background:linear-gradient(90deg,#2a78d6,#eb6834,#1baf7a,#eda100,#e87ba4,#4a3aa7);}
  h1{font-size:1.3rem;margin:0 0 .3rem;color:#1f2430;}
  .sub{color:#68707e;font-size:.88rem;margin:0 0 1.5rem;}
  label{display:block;font-size:.85rem;font-weight:600;margin-bottom:.3rem;}
  input{width:100%;box-sizing:border-box;padding:.65rem .8rem;border:1px solid #d7dade;border-radius:6px;font-size:.95rem;margin-bottom:1rem;}
  input:focus{outline:2px solid #d5601a;outline-offset:1px;}
  button{width:100%;background:#d5601a;color:#fff;border:none;padding:.7rem;border-radius:6px;font-size:.95rem;font-weight:600;cursor:pointer;}
  button:hover{background:#b5500f;}
  button:disabled{opacity:.6;cursor:default;}
  .mensaje{font-size:.85rem;margin-top:1rem;text-align:center;}
  .mensaje.is-error{color:#d6293b;}
  .mensaje.is-ok{color:#1a7f5a;}
  .estado-msg{text-align:center;color:#68707e;padding:2rem 1rem;}
  a{color:#d5601a;}
</style>
</head>
<body>
  <div class="card" id="contenido">
    <h1 data-i18n="reset_password_titulo">Nueva contraseña</h1>
    <p class="estado-msg" id="verificando" data-i18n="reset_password_verificando">Verificando el enlace…</p>

    <form id="form-reset" hidden>
      <label for="reset-password" data-i18n="reset_password_nueva_label">Contraseña nueva</label>
      <input type="password" id="reset-password" required autocomplete="new-password" minlength="6" aria-describedby="reset-mensaje" />
      <label for="reset-password-2" data-i18n="reset_password_confirmar_label">Confirma la contraseña</label>
      <input type="password" id="reset-password-2" required autocomplete="new-password" minlength="6" aria-describedby="reset-mensaje" />
      <button type="submit" id="btn-reset-submit" data-i18n="reset_password_btn">Guardar contraseña</button>
      <p id="reset-mensaje" class="mensaje" role="alert" hidden></p>
    </form>

    <p class="estado-msg" id="link-invalido" hidden>
      <span data-i18n="reset_password_link_invalido"></span>
      <br /><a href="index.html" data-i18n="reset_password_volver_login">Volver al inicio de sesión</a>
    </p>
  </div>

  <script src="i18n.js"></script>
  <script src="config.local.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script>
    aplicarIdioma();
    const sb = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);

    let sesionLista = false;

    sb.auth.onAuthStateChange((event) => {
      if (event === "PASSWORD_RECOVERY") {
        sesionLista = true;
        document.getElementById("verificando").hidden = true;
        document.getElementById("link-invalido").hidden = true;
        document.getElementById("form-reset").hidden = false;
        document.getElementById("reset-password").focus();
      }
    });

    setTimeout(() => {
      if (!sesionLista) {
        document.getElementById("verificando").hidden = true;
        document.getElementById("link-invalido").hidden = false;
      }
    }, 4000);

    document.getElementById("form-reset").addEventListener("submit", async (e) => {
      e.preventDefault();
      const p1 = document.getElementById("reset-password").value;
      const p2 = document.getElementById("reset-password-2").value;
      const mensaje = document.getElementById("reset-mensaje");
      const btn = document.getElementById("btn-reset-submit");

      if (p1 !== p2) {
        mensaje.className = "mensaje is-error";
        mensaje.textContent = t("reset_password_no_coincide");
        mensaje.hidden = false;
        return;
      }

      btn.disabled = true;
      btn.textContent = t("enviando_label");

      const { error } = await sb.auth.updateUser({ password: p1 });

      if (error) {
        mensaje.className = "mensaje is-error";
        mensaje.textContent = t("reset_password_error");
        mensaje.hidden = false;
        btn.disabled = false;
        btn.textContent = t("reset_password_btn");
      } else {
        document.getElementById("form-reset").hidden = true;
        const ok = document.createElement("p");
        ok.className = "mensaje is-ok";
        ok.textContent = t("reset_password_exito");
        document.getElementById("contenido").appendChild(ok);
        const link = document.createElement("a");
        link.href = "index.html";
        link.textContent = t("reset_password_volver_login");
        link.style.display = "block";
        link.style.textAlign = "center";
        link.style.marginTop = ".75rem";
        document.getElementById("contenido").appendChild(link);
      }
    });
  </script>
</body>
</html>
